services:
  finos:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}
    container_name: finos-hotel
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - finos_data:/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  finos_data:
    name: finos_data
