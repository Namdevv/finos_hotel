name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: finos-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/finos_hotel

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:latest
            ${{ steps.image.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull image and restart
    needs: build
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Prepare image name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Prepare deploy directory
        shell: bash
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.prod.yml"
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::.env is missing on server: $DEPLOY_DIR/.env"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart
        shell: bash
        run: |
          cd "$DEPLOY_DIR"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f

      - name: Health check
        shell: bash
        run: |
          cd "$DEPLOY_DIR"
          for i in {1..12}; do
            if curl -fsS http://localhost:8000/api/health >/dev/null; then
              echo "OK: service is healthy"
              exit 0
            fi
            echo "Waiting for service... ($i/12)"
            sleep 5
          done
          docker compose -f docker-compose.prod.yml logs --tail=80 finos
          echo "::error::Service did not respond on /api/health"
          exit 1
