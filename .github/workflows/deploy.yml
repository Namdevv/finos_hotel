name: Deploy (self-hosted LAN)

# Push len main -> runner tren may dich (Windows) tu pull + rebuild + restart container.
# Runner nam trong LAN, tu poll GitHub => KHONG can mo port nao ra internet.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # cho phep bam "Run workflow" thu cong tren GitHub

# Chi 1 lan deploy chay tai 1 thoi diem (may yeu, tranh build chong cheo).
concurrency:
  group: finos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Khop voi label cua self-hosted runner.
    runs-on: [self-hosted, finos]

    defaults:
      run:
        shell: powershell
        # Thu muc clone DANG deploy tren may dich (noi da co san .env).
        # >>> Doi lai cho dung duong dan tren may ban <<<
        working-directory: D:\WorkPace\deploy\finos_hotel

    steps:
      - name: Pull code moi nhat
        run: |
          git fetch --all --prune
          git reset --hard origin/main

      - name: Rebuild & restart container
        run: docker compose up -d --build

      - name: Don image cu
        run: docker image prune -f

      - name: Kiem tra health
        run: |
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://localhost:8000/api/health -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Write-Host "Cho service len... ($i/12)"
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { Write-Error "Service khong phan hoi /api/health"; exit 1 }
          Write-Host "OK: service da len"
