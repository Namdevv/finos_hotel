name: Demo video

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/demo-video.yml"

permissions:
  contents: write

jobs:
  record-demo:
    name: Record Playwright demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Record demo video
        working-directory: frontend
        run: npm run demo:video

      - name: Copy demo video
        shell: pwsh
        run: |
          $video = Get-ChildItem -Path frontend/test-results -Recurse -Filter video.webm | Select-Object -First 1
          if (-not $video) {
            throw "Playwright did not produce video.webm"
          }
          New-Item -ItemType Directory -Force -Path docs/demo | Out-Null
          Copy-Item -Path $video.FullName -Destination docs/demo/finos-hotel-demo.webm -Force

      - name: Upload demo video artifact
        uses: actions/upload-artifact@v4
        with:
          name: finos-hotel-demo-video
          path: docs/demo/finos-hotel-demo.webm

      - name: Commit updated demo video
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo/finos-hotel-demo.webm
          if git diff --cached --quiet; then
            echo "Demo video unchanged."
          else
            git commit -m "chore: update demo video [skip ci]"
            git push
          fi
