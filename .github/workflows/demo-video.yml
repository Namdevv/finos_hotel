name: Demo video

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/demo-video.yml"

permissions:
  contents: write

jobs:
  record-demo:
    name: Record Playwright demo
    runs-on: [self-hosted]

    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Record demo video
        working-directory: frontend
        run: npm run demo:video

      - name: Copy demo video
        run: |
          $video = Get-ChildItem -Path frontend/test-results -Recurse -Filter video.webm | Select-Object -First 1
          if (-not $video) {
            throw "Playwright did not produce video.webm"
          }
          New-Item -ItemType Directory -Force -Path docs/demo | Out-Null
          Copy-Item -Path $video.FullName -Destination docs/demo/finos-hotel-demo.webm -Force

      - name: Build README GIF
        working-directory: frontend
        run: npm run demo:gif

      - name: Commit updated demo video
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo/finos-hotel-demo.webm docs/demo/finos-hotel-demo.gif
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Demo video unchanged."
          } else {
            git commit -m "chore: update demo video [skip ci]"
            git push
          }
